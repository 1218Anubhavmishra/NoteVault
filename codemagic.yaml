# Codemagic CI for NoteVault (iOS). Builds only start manually from the Codemagic UI (no push triggers),
# so free-tier build minutes aren't spent on every commit.
workflows:
  # Unsigned simulator build: no Apple Developer account needed. Universal (arm64 + x86_64) so the
  # zipped App.app runs in Xcode's Simulator on both Apple-silicon and Intel Macs.
  ios-simulator-build:
    name: iOS simulator build (unsigned)
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      node: 20
      xcode: latest
      vars:
        ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Copy web assets into the iOS project
        script: npm run cap:sync:ios
      - name: Build for iOS simulator
        script: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Zip simulator app
        script: |
          cd build/ios/Build/Products/Debug-iphonesimulator
          zip -r "$CM_BUILD_DIR/NoteVault-simulator.zip" App.app
    artifacts:
      - NoteVault-simulator.zip

  # Live testing without a Mac: start this with "Enable SSH/VNC access" ticked, then connect with a VNC
  # viewer. NoteVault is already open in an iPhone simulator. Cancel the build when done - connected time
  # counts as build minutes. (The VM has no microphone, so recording can't be tested here.)
  ios-simulator-vnc:
    name: iOS simulator via VNC (live test)
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      node: 20
      xcode: latest
      vars:
        ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Copy web assets into the iOS project
        script: npm run cap:sync:ios
      - name: Build for iOS simulator
        script: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Boot iPhone simulator and launch NoteVault
        script: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          for runtime in sorted(devices, reverse=True):
              if 'iOS' in runtime:
                  for d in devices[runtime]:
                      if d['name'].startswith('iPhone'):
                          print(d['udid']); sys.exit()
          ")
          echo "Using simulator $UDID"
          xcrun simctl boot "$UDID" || true
          open -a Simulator
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/ios/Build/Products/Debug-iphonesimulator/App.app
          xcrun simctl launch "$UDID" xyz.voicevault.app
      - name: Keep the machine available for VNC (cancel the build when finished)
        script: |
          echo "Open 'Explore build machine via SSH or VNC/RDP client' above the build steps and connect now."
          sleep 1800

  # Signed App Store build. Requires the Apple Developer Program and, in Codemagic:
  # Team settings > Integrations > Developer Portal (App Store Connect API key) named below,
  # plus an app record for xyz.voicevault.app in App Store Connect.
  ios-release:
    name: iOS release (App Store)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: NoteVault App Store Connect key
    environment:
      node: 20
      xcode: latest
      vars:
        ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      ios_signing:
        distribution_type: app_store
        bundle_identifier: xyz.voicevault.app
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Copy web assets into the iOS project
        script: npm run cap:sync:ios
      - name: Apply signing profiles
        script: xcode-project use-profiles
      - name: Set build number
        script: |
          cd ios/App
          agvtool new-version -all $(($BUILD_NUMBER + 1))
      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
