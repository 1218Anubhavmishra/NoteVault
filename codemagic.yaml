# Codemagic CI for NoteVault (iOS). Builds only start manually from the Codemagic UI (no push triggers),
# so free-tier build minutes aren't spent on every commit.
workflows:
  # Unsigned simulator build: no Apple Developer account needed. Verifies the iOS project compiles.
  ios-simulator-build:
    name: iOS simulator build (unsigned)
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      node: 20
      xcode: latest
      vars:
        ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Copy web assets into the iOS project
        script: npx cap sync ios
      - name: Build for iOS simulator
        script: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Zip simulator app
        script: |
          cd build/ios/Build/Products/Debug-iphonesimulator
          zip -r "$CM_BUILD_DIR/NoteVault-simulator.zip" App.app
    artifacts:
      - NoteVault-simulator.zip

  # Signed App Store build. Requires the Apple Developer Program and, in Codemagic:
  # Team settings > Integrations > Developer Portal (App Store Connect API key) named below,
  # plus an app record for xyz.voicevault.app in App Store Connect.
  ios-release:
    name: iOS release (App Store)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: NoteVault App Store Connect key
    environment:
      node: 20
      xcode: latest
      vars:
        ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      ios_signing:
        distribution_type: app_store
        bundle_identifier: xyz.voicevault.app
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Copy web assets into the iOS project
        script: npx cap sync ios
      - name: Apply signing profiles
        script: xcode-project use-profiles
      - name: Set build number
        script: |
          cd ios/App
          agvtool new-version -all $(($BUILD_NUMBER + 1))
      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
